body:
  text: 郡守許國誠𪔂臣甫增修郡司訓高一福輯正古蹟招在城西南十里一名獸窟山自常山五洲延袤至黃鶴山之西北磨笄山之後有寺深邃幽雅盖為劉宋處士所故名招梁昭明太子統亦嘗讀書于此今昭明石案猶存寺之後有石洞四北有真珠泉西有鹿跑泉虎跑泉有石井傳謂昭明所開有萬松關蕭梁子讀書臺今廢寺自宋景平元年曇度禪師始創天王殿又有增華閣玉蕊亭今亦廢有萬古常清亭觀泉亭有米芾戴顒高士記斷碑唐宋諸賢題咏石刻正統中移于鶴林寺在此寺之東南永樂間盛極而衰亭榭臺閣悉皆荒蕪僧亦無以自存徃徃逃去嘉靖間有正讓者毘陵惠山僧也適來主寺見寺頹圮乃奉郡守林公華命力為修葺飾殿宇佛像廻廊石梁泉亭以次𣇄建懇田二十餘畆植𣗳萬餘株稍稍自給嗣是漸以消耗而僧又引去寺亦幾廢萬曆己亥郡守許公復捐俸修葺易其扁曰鹿泉寺又擇寺西山麓稍高敞者建堂四丈餘堂之左右別為東西廂繚以垣墻扁曰玉蘂仙踪左虎泉右鹿泉前遠眺大江靜虛閒泰中而得軒豁洞達之趣盖真潤州第一勝槩也招舊無志許公命修訂之并輯詩文附于翠山志後以全南徐之景盖與二山爭烈云鹿泉寺五言詩陪潤州薛司空丹徒桂明府游招寺駱賔王共尋招寺初識戴顒家還依舊泉壑應攺昔雲霞綠竹寒天笋紅蕉臘月花金繩俏留客為繫日光斜招寺劉禹錫士遺塵在高僧精舍開地形臨渚斷江勢觸山廻楚野花多思南禽聲例哀殷勤最高頂閒即望鄉來招寺張祜千年戴顒宅佛廟此崇脩古寺人名在清泉鹿跡幽竹光寒閉院山影夜藏樓未得高僧旨烟霞空暫遊郡守東萊勝侯約遊招山醉中紀興楊一清朝出虎踞門旋經鴻鶴山舉目望招森森青翠攢肩輿歷丹梯直造浮雲端縈紆路若無恍惚非人間郡侯政稍暇約我一日閒而我性疏野此興良不慳同遊總儒彥相見各開顏不嫌方丈陋抵掌共清歡山僧老而朴非俗亦非禪因之訪遺跡咄咄竟忘言昭明讀書處石案猶未刓彼戴顒宅浮屠今踞蟠寂寞玉蘂亭凋蕭萬松關惟有名賢詩能膾炙人傳侯曰此勝遊吾當窮躋攀山頭覔三洞山下尋三泉探奇兼索慎勿辭險艱大洞邃而迂懸厓亘蜿蜒二洞稍明曠鉅石誰所安可琴復可奕可以羅盤飡披搜到三洞小窟橫榛菅鬼斧鑿誰施神驅不容鞭雲根虎鹿跑真珠濺潺湲源頭秪一勺流潤滋園田想當出門時溽暑尚未瀾山巔坐良久已覺絺綌單濃陰釀急雨老病怯高寒雨歇氣蕭爽豁然襟抱寬脩竹光逾麗殘花色猶殷去城纔咫尺乃有此區寰諸公各盡興雄飲吸百川夕陽度西嶺暝色迷巑岏落葉隨流去飛鳥和煙還蟋蟀戒無荒呼僮促回作詩謝同遊聊以識奇觀春日邀陳自所郡矦招寺登覽鄔紳今代招提境先朝處士居王春停五馬佛日演三車香裊蓮華座風翻貝葉書禪雲晴縹緲祗𣗳晝扶踈山鳥歌相似巖花錦不如洞疑龍臥處泉是虎跑餘沓嶂啣斜照澄江浸太虛何年載餘興重訪遠公廬秋日遊招寺回飲于竹院高一福福清古逃跫虛宦餘訪禪居山僧迎谷口徑僻且停車躡磴雲穿足攀巖藤引祛泉清虎跑迹水曲蛇廻潴浮白流霞瑩散步曳鸞琚渴飲龍唇澤靜聆鳥韻紓羣山抱勝美境度居諸我仕亦稱齋居獨自如塵韁不染慮契爾恋躊躇戒僕休脂轄曠懷竟未除旋車經鶴寺竹院憶蘇廬暢飲竟餘日偕朋擷囿蔬暮雲山環聚怯雨乃登輿賡和咏以歸黃花歸與與鹿泉寺七言詩詠玉蘂花龔理山水窟宅江之南搜奇抉勝味飽諳朱方招最超絕𣗳作玉蘂珠濺潭高花密葉互掩映柔柯老𠏉相撑擔叢林何事着此𣗳香嚴鼻觀禪獨叅繞之百匝足未止贊以千偈言獨甘空山變滅異今昔枯松折竹徒侵攙彜器遷移鍾鼎去誰復別識缶與罎溫澤縝栗夙比德棄使不見情難堪東皇移根謹訶護玉立殿陛清光涵蘂宮仙人委長珮青髻一尺瑤華簪長齋三時晝方靜凍雨一洗春正酣眼中突兀現妙品繚以閣道棲神庵瞿曇老聃共空寂出彼入此容何慚人間多事到詩酒甚欲忍口牢三緘荒城邂逅此粲者換飲却肯𢬵春衫時當晴埃吹野馬採掇沃若眠吳蚕清尊如空雜花莖落日欲墮西山衘流年過眼急如電留此一賞容非貪即今芳事已塵土我軰正爾多空談詠玉蘂花李德裕玉蘂天中樹金閨昔共窺落英閑舞雪密葉乍低帷舊賞煙霄遠前歡月移今來想顏色還似憶瓊枝春望鄔紳梁皇帝子有仙臺詞客春遊騎鶴來遠岫千重雲外出澄江一道鏡中開林垂桃實珠為𣗳酒泛梅英玉作杯欲向山中招士滿川明月未應廻招隱采木工一止一寺龔思菴崇岡餘嶺澷登登古木蒼藤互鬱層寺接鶴林容我憇堂虛綠野共誰凭馬禪柱錫空留偈民役輸征實累僧郡有循良思問訊烟籠萬叠暮山凝南涯玉山南郭三大夫邀登招用舊韻張寰老我名山許數登寺藏招路層層金焦銜照遙堪睇虎鹿跑泉近可凭五載重過賡舊詠一龕暫憩傍閒僧將依三老投吟社萬壑千崖紫翠凝遊招隱采木工一止一寺韓克濟靜盱獸窟石案平何許人署招名潔身已聞戴處士居業兼有梁昭明金山焦山翠微合虎跑鹿跑蒼玉鳴結茅臥此亦不惡默然長與吾心盟同吳文臺郡守徐龍寰邑令游招二首趙錦百轉蒼崖路未窮萬松深處古禪宮亭臺已出諸天上山水還歸一覽中遶砌流泉寒尚駛入簾秋色晚逾紅人間共詫金焦勝自是仙源不易逢幾廻京口歷崔巍更有幽宮未及窺翠峰成幃深自好長江作帶遠逾奇人天咫尺塵難到松徑逶迤過每遲不是使君多暇豫花間誰為席頻移遊招隱采木工一止一寺王士崧振衣突兀過諸天乘興還登萬仞顛巒翠列屏浮檻外江流如帶盪杯前奇觀不數三山勝幽趣全收二堂留古蹟懷人千載思悠然招寺賦唐劉乾着其始穿竹田以行崎嶇詰曲十餘里而後至草木幽異猿猱下來空谷無人水流花開寺門東向趾古搆新茅茨接於碧瓦畫墻見乎苔侵青山澹乎吾慮潭影空乎人心噫予何來之晚也寺之東南山氣森肅泉名虎跑石泓萬斛色若漬藍聲如戞玉下注三坎雷奔雪觴懸崖赴壑而不危附川到海而氣足嗚呼奇哉古人之文流出肝肺混混而不竭者甚有似於斯而今也不在於傼舊聞梁有昭明太子此曾養晦讀書於此安得起九原而與之言哉忽然天風吹衣林有清嘯化耶鬼耶萬竅叫耶客有五人者携壺促予披雲上但求所謂讀書臺而吊之立孤峰以展眺探古洞而搜異拂蘚文之午封悵石章之滅既雲冉冉以閑飛松颾颾而晴吹驚恠木之如龍悅鳥語之禪味悟我生之無始卑佛書之揭諦假使昭明之猶在將謂此語之不易彼既與未死而俱徃吾故乘元化而再至臺之上兮多月明臺之下兮古道不可行茅山青兮練湖平美人不復兮我心如縈遂與客躡雲根縁鳥道距盤石而坐焉烟霞極目其平如席殘陽一片萬屋露脊叅蒼閒赭如畫如織閱大塊之文章歎斯遊之奇跡已而悲風凄其四起暝色合乎寒城客寺予而俱返別遣謝乎山靈門人會志曰京口之山蓋金焦北固為最著云獸窟山在城南十里許有奇觀數種往抱道者常樂隱其間因又稱招隱山焉然地辟路幽終不若三山之多所登臨播名方內也吾師劉夫子典教茲土無何教行化浹乃間賦三山復賦招隱夫招隱山自劉禹錫氏來其詠題者不少唯是賦發揚殆盡可以與君子探闚之思久當與三山爭盛矣然則是賦曷可廢哉會故敬暨夏生汝李生渠李生勳童生舉王生應勒諸石玉蘂仙踪堂記許國誠郡守郡之南十里許有獸窟山劉宋處士戴顒焉故其山之寺名招考南史顒世居剡中又徙京口常居竹林其後築舘此山文帝每欲見之至謂東巡之日當宴戴公山下即其地也元俞用中碑云戴顒女捨宅為院後誓志于此山之東南因以磨笄名山及梁昭明太子亦嘗讀書于此今石案猶存而寺則自宋景平元年曇度禪師始創也寺北有真珠泉西有鹿跑虎跑二泉而虎跑之泉有龍嘴噴出引為流觴曲水稍進舊有玉蘂亭岳珂題咏而李衛公有詩刻之石按志玉蘂再嵗始着花鬚如氷絲上綴金粟花心類膽瓶中別抽一英出眾鬚上散為十餘蘂猶刻玉然故劉夢得有雲蘂瓊絲之句世傳神女下遊折花而去以踐玉峰之期盖仙品也蔡寬夫謂招無復此花而亭因以廢余承乏守郡諏名山異蹟偶暇登覽之曲徑紆廻蒼莽盤桓登其山前有古坊始以入寺環山懷抱四旁羅密真高岩扉也因觀鹿跑虎跑二泉中間頗宏敞登其麓高幾丈許一覽之兩山開抱若拱若揖中襟大江若帶高明洞達令人有吞海吸江之想余喜謂諸同寅可搆築于斯以增山之勝僉以為然遂捐俸鳩工鑿山築堂其間堂成余改其寺之額曰鹿泉寺盖取鶴林鹿泉二寺並稱攺其泉上之亭曰觀泉而堂則扁之曰玉蘂仙踪盖冀其復有此花以寓思也或者謂余甫按郡而治登遊之所得無妨政乎余謂為政之道要在清心省事以與其民相安於和平余竊見趙寧宇先生以此須諭甚三復之潤州民風頗淳簿書頗簡然南北之衝舟車輻輳奔走應接神不啻勞矣非藉公事之暇尋幽登山以怡養其性情豁達其胷襟則心惡得清政惡得平而民惡得被其澤乎故搆斯堂者且將為政治之助而又何妨焉或者又謂余素不信神仙而茲以玉蘂仙踪名其堂得無誕乎余又謂神仙之事固其有之然惟生則為人沒則為神仙與佛皆神也人生而精正直其性行能自脩其德澤能以及人則沒自為仙為佛不待學而然也其不能者乃為鬼而為仙佛所役使彼其呼吸吐納偃仰屈伸不過養生之一節非其所以仙也世之學仙者吾甚咲焉故神仙不可學而未嘗不可談題名仙踪亦談之而已至於僧家脩佛亦然其棄妻子滅人倫甚無當於義然山川之勝堂宇之潔非得僧家清靜以守之其將付之誰乎故山必有寺寺必有僧胡可少也然使僧而能守其法戒清靜慈悲居茲山勝愛惜保護務貽之永久則為山靈所庇其沒必成佛如不潔不脩蕪穢山靈著則生有空門之苦死亦厲鬼之徒可不戒哉可不戒哉茲堂成必以付之僧吾固以是告之而且以破夫天下之慕仙佛者也是為記招寺記郡人曹慎吾潤江山之勝甲于東南金焦北固崇隆脩曠廻日星而瞰風雨遊目八極眇忽萬象固天下之大觀也然曠矣而未奧探奇者猶𢦙少之謂幽人之趣未極也城南十里得招焉地遐以僻林莽蓊薆自郭之野平綠被壠道夾喬木秀蒨撲眉睫伏流淙淙鳴草下紆廻曲折途窮而寺見含桃千章燦然若錦殿外兩泉其一為虎跑石鑿龍口以竇泉乳晝夜噴震作雪湧狀引而曲之倣蘭亭為流觴其一為鹿跑渟膏澄澈可數顱髮昔人登太嶽尚謂山贏水詘此山數武內雙泉泠泠兩亭如翼其不强人意乎方丈後古松藂茂蒼鱗駁犖號萬松關山巔巃嵸峭㧞巖洞𥥆曲俯首而入玉蕋下垂如墜授几席可憩可飲洞口碧梧被之薜蘿綴之青蘚環周綠縟蔥蔚使棲霞飡玉者值此不以為玄都洞室耶唐人論遊以奧與曠並三山雄偉咸得其曠而招獨得其奧真伯仲也曠者冠盖駢集飾之恒新奧者則鮮至矣邑當南北孔道庶政㫄午奚暇及此東越龍寰徐公來令茲邑弘才駿發事至若游刃未嘗以劇自撓時大府文臺吳公方貞度肅僚於上府佐西泉高公翼蒼王公永思項公海樓左公分猷贊政於中公祗受成憲奉持而恪行之政平人理庭無留務間命駕於山水以愜其對育之懷遊此而異之曰此奇觀也胡荒蕪若此無亦周轍之不至謝屐之不經耶謀鼎新焉因請命於吳公吳公聞而韙之四公僉同遂十日鳩工搆楹濬池不數月而煥然攺覩聴山若增而高泉若增而深洞若增而巧夭喬飛躍售奇於目者益不可臚述矣既成吳公以政事之暇偕四公登覽勝槩公從遊亭下虎跑飛流縹碧瀯瀯者與耳謀鹿跑靜虛瑩湛淵淵者與神謀二者異趣而動靜一機也陟山酒羣峰秀色時時來襲人衣雲浮鳥翔雅歌互荅韻動巖谷恍乎仙境矣既而召余遊且問記余曰柳子厚有云為政者必有遊息之具高明之物使清寧平夷恒若有餘然後理達而事成崔刺史之萬石裴中丞之訾洲歐文忠之瑯琊皆紓志意以為理道之助非小也諸公既以碩德宿望坐治吾郡而徐公仰事於下同心厪政清風播江南渥澤淪洽已有年矣相與寄情茲寺以示偕樂豈徒遊豫已哉且也三山偉觀海內稱最徐公從諸公常従其巔遙吟俯眺盖已襟度凌天表而狹宇宙乃尤寓意於此其諸湛恩浩蕩而窮簷尤加意者乎將規模宏遠而幽必察也抑登崇俊乂而飯牛版築巖穴尤㫄求也古稱得其致得其勝得其人者於今再見矣他日握衡樞陪坐論必將先憂後樂以傳澤於天下豈特吾郡吾邑之慶哉而吾郡吾邑則首加意地也余於茲舉知吳公能樂其樂又知四公及徐公能樂吳公之樂而尤幸余得樂諸公之樂也記以俟之徐公諱桓別號龍寰浙江會稽人重修招寺記鄔紳招山一名獸窟羣峰環其三面而大江襟帶其北其中稍平衍可居初為劉宋徵士戴顒故宅其女捨以為寺名曰招亦因以名其山取淮南王招士之义盖為顒也𢦙曰梁昭明太子統嘗讀書于此亦名招云山之西有泉三曰真珠曰鹿跑曰虎跑而虎跑尤渟泓澄瑩其流泠泠有聲不舍晝夜因導以為流觴曲水踰山而南有石洞四洞之中大者可設几席容數人洞之趾為敞軒俯視江流稍前為禪房棲釋子盖寺之別院也大率寺境幽邃奇勝為郡之最而巖阿崇搆林杪飛甍之盛殆與金焦北固爭雄學士大夫遊者繼踵題詠頗富元俞別駕用中之述備矣迨我明永樂間盛極而衰僧庸教弛昔之門廡臺榭橋梁樓閣悉皆蕪沒頃猶及見所謂萬松關者今亦有存徃徃牛羊外來魑魅羣行荊棘榛莽遍滿岩谷其東北有寺曰鶴林舊為寺之下院今顧稅其地以自贍征租索賦殆無虛日為主僧者力不支席未暇煖輙逃去而正讓者毘陵惠山僧也其人頗聰明悅禪味適來主寺廼已勤行刈蓬蒿葺翳伐石于山取材于市首葺約錙其殿宇飾其像設次為山門為天王殿為廻廊為石梁為泉亭又以其余力墾田二十餘畆種𣗳萬餘株以給經費而前太守巽峰林公實倡之至是煥然一新見者攺觀寺亦永有脩賴矣經始於庚寅訖工于癸丑凢二十有四年厥惟艱哉眾僉謂讓復三年不至則寺或幾乎廢矣一日語其徒曰作而不記非盛事也相與謀乞文於余余志在肥遯尤喜讀書以寺為戴徵士居且有蕭梁子讀書臺心甚愛之數數遊焉而輙來追隨聞告余以重修之故余嘉其不墜徃蹟也遂為之記萬古清流記周儒招古剎也四山環翠百卉挺秀南有虎跑泉流出巖下清冽可掬而飲舊有方地匯泉泉混混又流出一大方池郡人袁氏繼祖慕義好事捐貲鳩工鑿石欄圍其池池前建亭亭下引泉作流觴曲水源長而景亦奇矣太守公清修古道治鎮三載六事孔修百度具舉每于政暇率同寅遊招命人持盤飱一二味酒一壺共飲于亭移時太守公鼓琴池上諸同寅環坐以聴平慾釋躁雖隸卒侍立忘倦焉儒叨寅末謀於鄒君揚趙君獻常龔君秉德曰太守公倡遊此泉夫豈漫遊怡情杯盤已哉公惕歷中外甘清苦如飴意將借清泉以貽訓乎其古人譬治于亏乎吾軰盍淬礪乎僉謀扁萬古清流于亭志公遺愛也儒載颺言曰自有此山即有此泉不濬不導幾萬斯年造物遺功若俟後賢袁氏好義以潤色之鑿為二池𣗳為一亭山不過千仞意擬衡靈池不盈數丈量若江海知足造適境不在天恠石纍纍流湍潺潺仙洞在北雲興其間公登山樂同樂無間操琴咏歌花麗鳥喧朱旛徐驅明月滿山於戯人寔弘道物不自美向㣲羊公遊漢之涘峴山寂寞千古誰紀後之聆清風而起敬者盍挹公于泉乎於是二三君子咸曰吾固知太守公之樂不在酒而在乎山水之間也聞子之言吾又知太守公之意不在乎山水而在垂穀於我人也太守謂誰莆陽林公華也如斯亭對今攺觀泉亭郡守林華著乙巳仲春閏月既望林子與寅友水東鄒子山泉趙子東川周子思菴龔子歸自峴山遙望江南諸峰神思飛動乃相與挈榼携琴復遊招山太宇氣清天光流形大江北流長山西峙鳥獸熈熈嘉林蔚然山有亭翼然臨于寒泉之上泉自亭穿崖而下川源出焉於是探石洞之雲巢沿廻巒之盤谷登昭明之書臺反而鼓琴歌咏其間泉聲泠泠與絃相應和諸君曰美哉泉乎清且漣漪林子舍琴鏗然而作喟然而嘆曰斯夫子之所謂逝者如斯者乎既而合以如斯名其亭海嶽精舍諸生方挾羲經太極圖従予以遊進而問曰何謂也對曰此所謂天地設位而易行乎其中者也天地絪緼以融以結山澤通氣出乎無垠化機之無盡藏也流而不盈行險而不失其信放乎四海莫測其端自開闢以來今古幾更莫見其止道妙不息著乎川矣故聖人持發以示人豈惟一物凡化皆然川如斯其流山如斯其峙日月如斯其貞明風霆如斯其流形天地如斯其高厚寒暑如斯其來徃陰陽如斯其動靜鬼神如斯其不測百物如斯其化生磅薄宇宙逼塞虛空經緯今古與川流同妙者也故曰剛柔相摩八卦相盪鼓之以雷霆潤之以風雨日月運行一寒一暑乾道成男坤道成女終始天地生生不已者也不已者何誠也夫人者天地之心造化之管也誠之主也自有乾坤自有太極兼體而有之者也諸生登斯山而坐斯亭觀斯川天高地下鳶飛魚躍俯仰之間孰非備於我者子思子曰溥愽如天淵泉如淵故廣大配天地變通配四時陰陽之義配日月易簡之善配至德所謂萬物皆備於我矣反身而誠樂莫大焉邵子亦曰先天之學心法也萬事萬化生于心有作而言者曰茫茫大化藐然此身而以此擬彼奚但鮒魚滄海之不相及也林子曰是以形器言也夫以形器言雖造化不能以不變以理言則不以生存不以死亡我與造化俱無窮矣故夫盈虛消息之在天地者吾不得而與之矣而吾心之乾坤吾性之太極放之彌六合卷之退藏于密反身而誠則可與合德矣可與合德則性靈所通天壤俱在庸知千古之為前萬古之為後乎而何形器之拘也顧所以反身而養心者何如耳傳曰君子行此四德者故曰乾元亨利貞又曰養而無害則塞乎天地之間塞乎天地之間則天下之理得而成位乎其中矣大哉易也斯其至矣海嶽生唯唯諸君亦欣然而咲相與坐石觀雲烹茶論易浩然不知天地之為大吾身之為小也
