front:
  text: 鹿泉寺位於江蘇丹徒招隱山招隱山在城西南十里一名獸窟山羣峰環其三面而大江襟帶其北其中稍平衍可居劉宋時有處士戴顒隱於此山因以招隱名與焦山北固山金山黃鶴山合稱京口五名山山之西有三泉曰真珠曰鹿跑曰虎跑山中有寺深邃幽雅本為戴顒隱居處其女捨其宅為寺乃名寺為招隱寺自劉宋景平元年四二三曇度禪師始創天王殿又有增華閣王蘂亭後皆廢唐宋諸賢之題詠石刻明正統中移至鶴林寺此寺於明永樂間盛極而衰亭榭臺閣悉皆荒蕪嘉靖間有毗陵惠山僧正讓來主寺乃奉郡守林華命力為修葺飾殿宇佛像回廊石梁泉亭以次鼎建墾田二十餘畝植樹萬餘株始稍稍自給嗣是漸以消耗寺幾廢萬曆二十七年一五九九郡守許國誠復捐俸修葺易其匾曰鹿泉寺蓋取鶴林鹿泉二寺並稱又擇寺西山麓稍高敞者建堂匾曰玉蘂仙蹤招隱舊無記録郡守許國誠既修殿宇又倩郡博高一福增修京口三山全志乃輯有關招隱寺之詩文為一卷附於三山志後此志分古迹五言詩七言詩賦記等五目其中有關此寺之建置沿革者有古迹玉蘂仙蹤堂記招隱寺記重修招隱寺記萬古清流記等五篇餘者為藝文按此寺與鶴林同為古剎唐宋諸賢遊迹所至題詠刻石每多名家之作如米芾戴顒高士記之斷碑此志皆未採録京口三山全志初刻於正德七年一五一二萬曆間增補刊行今國立中央圖書館代管北平圖書館藏本即此本也其鶴林寺志有殘闕鹿泉寺志則尚完整茲據此藏本景印其版漫漶以無別本故不豫描補祈讀者鑒之
